name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, so a broken Python release shows up even without commits
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Full pipeline run on the sample data
        run: python -m gridpipe --db ci.db run
