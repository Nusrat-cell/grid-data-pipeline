<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Data Dashboard</title>
<style>
  :root { --ink: #18222d; --muted: #5e6b78; --line: #e2e6ea; --bg: #f6f7f9; --price: #1f5f8b; --wind: #4f9d69; --warn: #b5661b; --bad: #a33a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  h1 { font-size: 19px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; }
  select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile, section { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .tile { padding: 12px 14px; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .value { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .value.warn { color: var(--warn); }
  section { padding: 14px 16px; margin-bottom: 16px; }
  h2 { font-size: 14px; margin: 0 0 10px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-size: 10px; fill: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.selected { background: #eef4f8; }
  tr.click { cursor: pointer; }
  .gap { color: var(--warn); font-weight: 600; }
  .check { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 9px; color: #fff; height: fit-content; white-space: nowrap; }
  .badge.pass { background: var(--wind); } .badge.warn { background: var(--warn); } .badge.fail { background: var(--bad); }
  .detail { color: var(--muted); }
  .rejected { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .rejected li { margin-bottom: 3px; }
  .status { font-size: 13px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Grid Data Dashboard</h1>
    <p id="status" class="status">Loading...</p>
  </div>
  <div class="controls">
    <select id="area" aria-label="Price area"><option>DK1</option><option>DK2</option></select>
    <select id="day" aria-label="Day"></select>
  </div>
</header>
<main>
  <div class="tiles" id="tiles"></div>

  <section>
    <h2 id="chart-title">Hourly price and renewable share</h2>
    <div class="legend"><span style="--c: var(--price)">Spot price, EUR/MWh (line)</span><span style="--c: var(--wind)">Wind + solar share of consumption (bars)</span></div>
    <svg id="chart" viewBox="0 0 900 260" role="img" aria-label="Hourly price and renewable share"></svg>
  </section>

  <div class="grid2">
    <section>
      <h2>Daily summary</h2>
      <table>
        <thead><tr><th>Date</th><th class="num">Avg price</th><th class="num">Min / max</th><th class="num">Renewables</th><th class="num">Hours</th></tr></thead>
        <tbody id="daily"></tbody>
      </table>
    </section>
    <section>
      <h2>Data quality, last run</h2>
      <div id="checks"></div>
      <div class="rejected"><b>Rejected rows</b><ul id="rejected"></ul></div>
    </section>
  </div>
</main>
<script>
  // All text from the API goes in with textContent, never innerHTML.
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, kids = []) => {
    const n = Object.assign(document.createElement(tag), props);
    for (const k of [].concat(kids)) n.append(k);
    return n;
  };
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    return n;
  };
  const get = async (path) => {
    const res = await fetch(path);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    return body;
  };

  let daily = [];

  function renderTiles(day) {
    const gap = day.hours_covered !== day.expected_hours;
    const tiles = [
      ['Avg price', `${day.avg_price_eur.toFixed(1)} EUR`],
      ['Renewable share', `${Math.round(day.renewable_share * 100)}%`],
      ['Negative-price hours', day.negative_price_hours],
      ['Consumption', `${Math.round(day.consumption_mwh).toLocaleString('en')} MWh`],
      ['Hours of data', `${day.hours_covered} / ${day.expected_hours}`, gap],
    ];
    $('tiles').replaceChildren(...tiles.map(([label, value, warn]) =>
      el('div', { className: 'tile' }, [el('div', { className: 'label', textContent: label }), el('div', { className: 'value' + (warn ? ' warn' : ''), textContent: value })])));
  }

  function renderChart(rows) {
    const svg = $('chart');
    svg.replaceChildren();
    if (!rows.length) return;
    const W = 900, H = 260, L = 44, R = 44, T = 12, B = 30;
    const iw = W - L - R, ih = H - T - B;
    const prices = rows.map((r) => r.price_eur);
    const pMin = Math.min(0, ...prices), pMax = Math.max(...prices) * 1.1;
    const sMax = Math.max(1, ...rows.map((r) => r.renewable_share));
    const x = (i) => L + (i + 0.5) * (iw / rows.length);
    const yP = (p) => T + ih - ((p - pMin) / (pMax - pMin)) * ih;
    const yS = (s) => T + ih - (s / sMax) * ih;
    const bw = (iw / rows.length) * 0.7;

    for (let k = 0; k <= 4; k++) {
      const p = pMin + ((pMax - pMin) * k) / 4;
      svg.append(svgEl('line', { x1: L, x2: W - R, y1: yP(p), y2: yP(p), stroke: '#e2e6ea' }));
      const t = svgEl('text', { x: L - 6, y: yP(p) + 3, 'text-anchor': 'end' }); t.textContent = Math.round(p); svg.append(t);
      const s = (sMax * k) / 4;
      const t2 = svgEl('text', { x: W - R + 6, y: yS(s) + 3 }); t2.textContent = Math.round(s * 100) + '%'; svg.append(t2);
    }
    rows.forEach((r, i) => {
      svg.append(svgEl('rect', { x: x(i) - bw / 2, y: yS(r.renewable_share), width: bw, height: T + ih - yS(r.renewable_share), fill: '#4f9d69', opacity: 0.35 }));
      if (i % 3 === 0) {
        const t = svgEl('text', { x: x(i), y: H - 10, 'text-anchor': 'middle' });
        t.textContent = r.hour_utc.slice(11, 16);
        svg.append(t);
      }
    });
    svg.append(svgEl('polyline', { points: rows.map((r, i) => `${x(i)},${yP(r.price_eur)}`).join(' '), fill: 'none', stroke: '#1f5f8b', 'stroke-width': 2.2 }));
    const cap = svgEl('text', { x: L, y: H - 0.5 }); cap.textContent = 'Hour (UTC)'; svg.append(cap);
  }

  function renderDaily(area, selected) {
    $('daily').replaceChildren(...daily.filter((d) => d.price_area === area).map((d) => {
      const gap = d.hours_covered !== d.expected_hours;
      const row = el('tr', { className: 'click' + (d.local_date === selected ? ' selected' : '') }, [
        el('td', { textContent: d.local_date }),
        el('td', { className: 'num', textContent: d.avg_price_eur.toFixed(1) }),
        el('td', { className: 'num', textContent: `${Math.round(d.min_price_eur)} / ${Math.round(d.max_price_eur)}` }),
        el('td', { className: 'num', textContent: Math.round(d.renewable_share * 100) + '%' }),
        el('td', { className: 'num' + (gap ? ' gap' : ''), textContent: `${d.hours_covered}/${d.expected_hours}` }),
      ]);
      row.addEventListener('click', () => { $('day').value = d.local_date; refresh(); });
      return row;
    }));
  }

  async function renderQuality() {
    const q = await get('/quality');
    $('checks').replaceChildren(...q.checks.map((c) => {
      const kind = c.passed ? 'pass' : c.blocking ? 'fail' : 'warn';
      return el('div', { className: 'check' }, [
        el('span', { className: 'badge ' + kind, textContent: kind }),
        el('div', {}, [el('div', { textContent: c.check_name.replaceAll('_', ' ') }), el('div', { className: 'detail', textContent: c.detail })]),
      ]);
    }));
    $('rejected').replaceChildren(...q.rejected_rows.map((r) => el('li', { textContent: `${r.source}, ${r.record_key}: ${r.reason}` })));
  }

  async function refresh() {
    const area = $('area').value, day = $('day').value;
    const today = daily.find((d) => d.price_area === area && d.local_date === day);
    if (today) renderTiles(today);
    $('chart-title').textContent = `Hourly price and renewable share, ${area}, ${day}`;
    renderChart(await get(`/hourly?area=${area}&date=${day}`));
    renderDaily(area, day);
  }

  async function init() {
    try {
      const health = await get('/health');
      $('status').textContent = `Last pipeline run #${health.last_run.run_id}: ${health.last_run.status}, finished ${health.last_run.finished_at}`;
      daily = await get('/daily');
      const days = [...new Set(daily.map((d) => d.local_date))];
      $('day').replaceChildren(...days.map((d) => el('option', { value: d, textContent: d })));
      $('day').value = days.includes('2026-03-29') ? '2026-03-29' : days[0];
      $('area').addEventListener('change', refresh);
      $('day').addEventListener('change', refresh);
      await Promise.all([refresh(), renderQuality()]);
    } catch (err) {
      $('status').textContent = `Could not load data: ${err.message}. Run "python -m gridpipe run" first.`;
    }
  }
  init();
</script>
</body>
</html>
